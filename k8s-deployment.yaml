# =====================================================================
# KUBERNETES MANIFEST FOR GREEN LOGISTICS MICROSERVICES ARCHITECTURE
# (Reads environment configuration dynamically from local .env via Secret)
# =====================================================================

# ---------------------------------------------------------------------
# 1. PERSISTENT VOLUME CLAIM & INITIALIZATION CONFIGMAP FOR POSTGRESQL
# ---------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
data:
  init_pr.sql: |
    CREATE TABLE IF NOT EXISTS trips (
        trip_id VARCHAR(36) PRIMARY KEY,
        timestamp TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
        origin VARCHAR(255) NOT NULL,
        destination VARCHAR(255) NOT NULL,
        geometry_polyline TEXT NOT NULL,
        origin_coords VARCHAR(100) NOT NULL,
        dest_coords VARCHAR(100) NOT NULL,
        vehicle_type VARCHAR(50) NOT NULL,
        cargo_weight_kg DECIMAL(10, 2) NOT NULL,
        route_priority VARCHAR(50) DEFAULT 'green',
        recommended_route_id VARCHAR(50) NOT NULL,
        predicted_co2_kgco2e DECIMAL(12, 4),
        distance_km DECIMAL(10, 2),
        duration_minutes DECIMAL(10, 2)
    );
---
# ---------------------------------------------------------------------
# 2. POSTGRESQL DATABASE (DEPLOYMENT & SERVICE)
# ---------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          envFrom:
            - secretRef:
                name: logistics-secret
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-data-volume
            - mountPath: /docker-entrypoint-initdb.d/init_pr.sql
              subPath: init_pr.sql
              name: postgres-init-volume
      volumes:
        - name: postgres-data-volume
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: postgres-init-volume
          configMap:
            name: postgres-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-db
spec:
  selector:
    app: postgres-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
# ---------------------------------------------------------------------
# 3. DATABASE REST API SERVICE (DEPLOYMENT & SERVICE)
# ---------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-service
  template:
    metadata:
      labels:
        app: db-service
    spec:
      containers:
        - name: db-service
          image: db-service:v2
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: logistics-secret
          ports:
            - containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: db-service
spec:
  selector:
    app: db-service
  ports:
    - port: 8002
      targetPort: 8002
  type: LoadBalancer
---
# ---------------------------------------------------------------------
# 4. ML PREDICTION SERVICE (DEPLOYMENT & SERVICE)
# ---------------------------------------------------------------------
apiVersion: apps/v1
