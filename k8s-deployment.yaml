metadata:
  name: ml-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
    spec:
      containers:
        - name: ml-service
          image: ml-service:v1
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: logistics-secret
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
spec:
  selector:
    app: ml-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
# ---------------------------------------------------------------------
# 5. ROUTING ENGINE (DEPLOYMENT & SERVICE)
# ---------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: routing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routing-service
  template:
    metadata:
      labels:
        app: routing-service
    spec:
      containers:
        - name: routing-service
          image: routing-service:v2
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: logistics-secret
          ports:
            - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: routing-service
spec:
  selector:
    app: routing-service
  ports:
    - port: 8001
      targetPort: 8001
  type: LoadBalancer
---
# ---------------------------------------------------------------------
# 6. FRONTEND UI (DEPLOYMENT & SERVICE)
# ---------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-ui
  template:
    metadata:
      labels:
        app: frontend-ui
    spec:
      containers:
        - name: frontend-ui
          image: frontend-ui:v5
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: logistics-secret
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend-ui
  ports:
    - port: 3000
      targetPort: 80
  type: LoadBalancer
