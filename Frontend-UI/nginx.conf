server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;

    index index.html;

    # =========================================
    # React/Vite application
    # =========================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================================
    # Dashboard / Frontend health
    # =========================================
    location = /api/health/dashboard {
        default_type application/json;
        return 200 '{"status":"healthy","service":"frontend-ui"}';
    }

    # =========================================
    # Database API health
    # Kubernetes Service: db-service
    # =========================================
    location = /api/health/database {
        proxy_pass http://db-service:8002/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # =========================================
    # ML API health
    # Kubernetes Service: ml-service
    # =========================================
    location = /api/health/ml {
        proxy_pass http://ml-service:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # =========================================
    # Routing API health
    # Kubernetes Service: routing-service
    # =========================================
    location /api/health/routing {
        proxy_pass http://routing-service:8001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # =========================================
    # Database Service API (/api/v1/trips)
    # Kubernetes Service: db-service
    # =========================================
    location /api/v1/trips {
        proxy_pass http://db-service:8002/api/v1/trips;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # =========================================
    # Routing Engine API (/api/v1/optimize-route)
    # Kubernetes Service: routing-service
    # =========================================
    location /api/v1/optimize-route {
        proxy_pass http://routing-service:8001/api/v1/optimize-route;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # =========================================
    # Static assets
    # =========================================
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}