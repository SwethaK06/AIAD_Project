version: "3.8"

services:
  # 1. PostgreSQL Database Container with Persistent Volume & Schema Initialization
  # Create a PostgreSQL 15 database container, configure it using my .env file, persist the database data, automatically initialize the database schema, expose PostgreSQL to my computer, connect it to my application network, and check whether the database is healthly.
  postgres-db:
    image: postgres:15-alpine
    container_name: logistics_db
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=localhost
      - POSTGRES_PORT=${POSTGRES_PORT}
      - PGADMIN_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./green-logistics-database/init_pr.sql:/docker-entrypoint-initdb.d/init_pr.sql
    networks:
      logistics_net:
        aliases:
          - postgres_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Database REST API Microservice
  # This define sthe database Service cotnainer in docker compose. It builds the database service from the Dockerfile in the green-logistics-database directory, sets up environment variables, exposes the service on a specific port, and ensures it only starts after the PostgreSQL database is healthy.
  db_service:
    build:
      context: ./green-logistics-database
      dockerfile: Dockerfile
    container_name: db_service
    env_file:
      - .env
    ports:
      - "${DB_SERVICE_PORT:-8002}:8002"
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - logistics_net

  # 3. Machine Learning Carbon Prediction Service
  # This defines the ML container in docker compose. It builds the ML service from the Dockerfile in the ML_Service directory, sets up environment variables, exposes the service on a specific port, and ensures it only starts after the PostgreSQL database is healthy.
  ml-service:
    build:
      context: .
      dockerfile: ML_Service/Dockerfile
    container_name: ml_service
    env_file:
      - .env
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    networks:
      logistics_net:
        aliases:
          - ml_service

  # 4. Route Optimization Engine
  # This defines the routing service container in docker compose. It builds the routing service from the Dockerfile in the routing-engine directory, sets up environment variables, exposes the service on a specific port, and ensures it only starts after the ML service and database service are healthy.
  routing_service:
    build:
      context: ./routing-engine
      dockerfile: Dockerfile
    container_name: routing_service
    env_file:
      - .env
    ports:
      - "${ROUTING_SERVICE_PORT:-8001}:8001"
    environment:
      - ML_SERVICE_URL=${ML_SERVICE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - OSRM_BASE_URL=${OSRM_BASE_URL}
    depends_on:
      - ml-service
      - db_service
    networks:
      - logistics_net

  # 5. Frontend UI Web Application
  # Its purpose is to build your React frontend application, run it inside a Docker container, make it accessible from your browser, and connect it to the same Docker network as your backend services.
  frontend:
    build:
      context: ./Frontend-UI
      dockerfile: Dockerfile
    container_name: frontend_ui
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - routing_service
    networks:
      - logistics_net

networks:
  logistics_net:
    driver: bridge

volumes:
  postgres_data:
